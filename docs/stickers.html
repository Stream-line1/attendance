<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מדבקות החתמה · המוביל החדש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0b1530; --red: #e3262d; --muted: #6b7591; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Heebo', system-ui, sans-serif; background: #eef1f7; color: var(--navy); }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 16px;
    background: var(--navy); color: #fff; }
  .bar b { font-size: 18px; margin-inline-end: auto; }
  .bar label { font-size: 14px; color: #c7cfe6; }
  .bar input { width: 70px; padding: 8px; border-radius: 10px; border: 0; font: 600 15px 'Heebo'; }
  .bar button { padding: 10px 18px; border: 0; border-radius: 10px; font: 700 15px 'Heebo'; cursor: pointer; color: #fff; background: var(--red); }
  .hint { max-width: 820px; margin: 14px auto 0; padding: 0 16px; color: var(--muted); font-size: 14px; }

  .sheet { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8mm; width: 190mm; margin: 16px auto 40px; }
  .sticker { background: #fff; border: 1.5px dashed #c5cbdb; border-radius: 5mm; padding: 5mm; height: 120mm;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; break-inside: avoid; }
  .sticker .top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .sticker .logo { width: 34mm; height: 19mm; object-fit: cover; }
  .sticker .truck { background: var(--navy); color: #fff; border-radius: 3mm; padding: 1.5mm 4mm; font-weight: 900; font-size: 6mm; }
  .sticker h2 { margin: 0; font-size: 6mm; font-weight: 900; }
  .sticker .qr svg { width: 52mm; height: 52mm; display: block; }
  .sticker .ways { display: flex; gap: 3mm; font-size: 3.4mm; color: var(--muted); }
  .sticker .ways span { border: 1px solid #dfe3ee; border-radius: 99px; padding: 1mm 3mm; }
  .sticker .nfc { color: var(--red); font-weight: 700; font-size: 3.8mm; }

  @media print {
    @page { size: A4; margin: 8mm; }
    body { background: #fff; }
    .bar, .hint { display: none; }
    .sheet { margin: 0 auto; gap: 6mm; }
    .sticker { border-style: dashed; }
  }
  @media (max-width: 820px) {
    .sheet { width: auto; grid-template-columns: 1fr; padding: 0 16px; }
  }
</style>
</head>
<body>
  <div class="bar">
    <b>מדבקות החתמה למשאיות</b>
    <label>ממשאית</label><input type="number" id="from" min="1" value="1">
    <label>עד</label><input type="number" id="to" min="1" value="70">
    <button onclick="render()">עדכון</button>
    <button onclick="print()">הדפסה</button>
  </div>
  <p class="hint">כל מדבקה כוללת קוד QR עם אותו קישור שבתג. מדפיסים על נייר מדבקות A4 (2 בכל עמוד), גוזרים לפי הקו המקווקו, ומדביקים מעל התג במשאית.</p>
  <div class="sheet" id="sheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const base = location.origin + location.pathname.replace(/stickers\.html$/, '');
function qrSvg(text) {
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
function render() {
  const from = Math.max(1, +document.getElementById('from').value || 1);
  const to = Math.max(from, +document.getElementById('to').value || from);
  let html = '';
  for (let n = from; n <= to; n++) {
    const url = `${base}?truck=${n}`;
    html += `<div class="sticker">
      <div class="top"><img class="logo" src="logo.jpg" alt=""><span class="truck">משאית ${n}</span></div>
      <h2>החתמת נוכחות</h2>
      <div class="qr">${qrSvg(url)}</div>
      <div class="nfc">📱 קרב טלפון כאן, או סרוק את הקוד במצלמה</div>
      <div class="ways"><span>NFC</span><span>מצלמה / QR</span></div>
    </div>`;
  }
  document.getElementById('sheet').innerHTML = html;
}
render();
</script>
</body>
</html>
