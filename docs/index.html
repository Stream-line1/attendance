<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<title>החתמת נוכחות · המוביל החדש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b1530; --navy-2: #13235a; --blue: #1f3fa8;
    --red: #e3262d; --gold: #d8b46a;
    --green: #22c55e; --text: #f5f7fb; --muted: #9aa6c4;
    --glass: rgba(255,255,255,.06); --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Heebo', system-ui, sans-serif; color: var(--text);
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(227,38,45,.22), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(31,63,168,.45), transparent 60%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px 24px;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 8px 0 22px; }
  .logo { background: #fff; border-radius: 22px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .logo img { width: 250px; height: 140px; object-fit: cover; display: block; border-radius: 18px; }
  .clock { font-size: 44px; font-weight: 800; letter-spacing: 1px; line-height: 1; }
  .date { color: var(--muted); font-size: 15px; font-weight: 300; }

  .card {
    width: 100%; max-width: 420px; border-radius: 28px; padding: 30px 24px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 60px rgba(0,0,0,.35); text-align: center;
    animation: rise .5s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
  .muted { color: var(--muted); font-size: 14px; font-weight: 300; margin: 0 0 20px; }

  label { display: block; text-align: right; font-size: 13px; color: var(--muted); margin: 14px 4px 6px; }
  input {
    width: 100%; font: 600 20px 'Heebo', sans-serif; letter-spacing: 2px; text-align: center;
    padding: 15px; color: var(--text); background: rgba(255,255,255,.05);
    border: 1px solid var(--line); border-radius: 16px; outline: none; transition: .2s;
  }
  input:focus { border-color: var(--gold); background: rgba(255,255,255,.09); box-shadow: 0 0 0 4px rgba(216,180,106,.15); }
  input::placeholder { color: #66729a; letter-spacing: 0; font-weight: 400; }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
    -webkit-text-fill-color: #f5f7fb; caret-color: #f5f7fb; -webkit-box-shadow: 0 0 0 1000px #1a2a5c inset; transition: background-color 9999s; }
  button {
    width: 100%; margin-top: 22px; padding: 16px; border: 0; border-radius: 16px; cursor: pointer;
    font: 800 18px 'Heebo', sans-serif; color: #fff;
    background: linear-gradient(135deg, var(--red), #b3141b);
    box-shadow: 0 12px 28px rgba(227,38,45,.4); transition: transform .15s;
  }
  button:active { transform: scale(.98); }

  .status {
    width: 128px; height: 128px; margin: 4px auto 18px; border-radius: 50%;
    display: grid; place-items: center; position: relative;
  }
  .status::before { content: ''; position: absolute; inset: 0; border-radius: 50%; animation: pulse 2s ease-out infinite; }
  .status svg { width: 60px; height: 60px; position: relative; }
  .status.in { background: linear-gradient(145deg, #2fd16b, #149a47); box-shadow: 0 18px 40px rgba(34,197,94,.45); }
  .status.in::before { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
  .status.out { background: linear-gradient(145deg, var(--red), #a3121a); box-shadow: 0 18px 40px rgba(227,38,45,.45); }
  .status.out::before { box-shadow: 0 0 0 0 rgba(227,38,45,.55); }
  @keyframes pulse { to { box-shadow: 0 0 0 28px rgba(0,0,0,0); } }
  .result-title { font-size: 30px; font-weight: 800; margin: 0; }
  .who { font-size: 20px; font-weight: 600; margin: 10px 0 2px; }
  .time { font-size: 15px; color: var(--muted); }
  .chips { display: flex; justify-content: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .chip { font-size: 13px; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid var(--line); }

  .spinner { width: 46px; height: 46px; margin: 30px auto; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--gold); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #ff8a8f; font-size: 15px; margin: 14px 0 0; min-height: 1em; }
  .hidden { display: none; }
  footer { margin-top: auto; padding-top: 24px; font-size: 12px; color: #5d6890; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo"><img src="logo.jpg" alt="קבוצת המוביל החדש"></div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>

  <div class="card">
    <div id="loading"><div class="spinner"></div><p class="muted">רושם החתמה…</p></div>

    <div id="register" class="hidden">
      <h1>ברוך הבא</h1>
      <p class="muted">רישום חד־פעמי של הטלפון. את הקוד האישי מקבלים מהמנהל.</p>
      <label for="idnum">תעודת זהות</label>
      <input id="idnum" type="tel" inputmode="numeric" placeholder="9 ספרות">
      <label for="pin">קוד אישי</label>
      <input id="pin" type="password" inputmode="numeric" placeholder="••••">
      <button id="regBtn">כניסה למערכת</button>
    </div>

    <div id="result" class="hidden">
      <div id="status" class="status"></div>
      <p id="title" class="result-title"></p>
      <p id="who" class="who"></p>
      <p id="time" class="time"></p>
      <div class="chips" id="chips"></div>
    </div>

    <p id="error" class="error"></p>
  </div>

  <footer>קבוצת המוביל החדש · הובלות ומנופים</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);
const truck = parseInt(new URLSearchParams(location.search).get('truck')) || null;
const $ = id => document.getElementById(id);
const show = id => ['loading', 'register', 'result'].forEach(x => $(x).classList.toggle('hidden', x !== id));
const ICON_IN = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>';

function tick() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  $('date').textContent = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
}
tick(); setInterval(tick, 10000);

function getToken() { try { return localStorage.getItem('driverToken'); } catch { return null; } }
function setToken(t) { try { localStorage.setItem('driverToken', t); } catch {} }

function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve({});
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => resolve({}),
      { timeout: 5000, maximumAge: 60000 });
  });
}

async function doPunch() {
  show('loading');
  $('error').textContent = '';
  const loc = await getLocation();
  const { data, error } = await sb.rpc('punch', {
    p_token: getToken(), p_truck: truck, p_lat: loc.lat ?? null, p_lng: loc.lng ?? null });
  if (error) {
    if (error.message.includes('לא רשום')) { setToken(''); show('register'); }
    $('error').textContent = error.message;
    return;
  }
  const isIn = data.kind === 'in';
  $('status').className = 'status ' + data.kind;
  $('status').innerHTML = isIn ? ICON_IN : ICON_OUT;
  $('title').textContent = isIn ? 'כניסה נרשמה' : 'יציאה נרשמה';
  $('who').textContent = (isIn ? 'משמרת מוצלחת, ' : 'תודה ולהתראות, ') + data.name;
  $('time').textContent = 'בשעה ' + new Date(data.at).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  $('chips').innerHTML = (truck ? `<span class="chip">משאית ${truck}</span>` : '')
    + (loc.lat ? '<span class="chip">מיקום נשמר</span>' : '')
    + (data.duplicate ? '<span class="chip">כבר נרשם</span>' : '');
  if (navigator.vibrate) navigator.vibrate(isIn ? 80 : [60, 60, 60]);
  show('result');
}

$('regBtn').onclick = async () => {
  $('error').textContent = '';
  const { data, error } = await sb.rpc('register_device', { p_id: $('idnum').value, p_pin: $('pin').value.trim() });
  if (error) { $('error').textContent = error.message; return; }
  setToken(data.token);
  doPunch();
};

getToken() ? doPunch() : show('register');
</script>
</body>
</html>
